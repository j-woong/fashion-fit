spring:
  application:
    name: worthit-backend
  config:
    # 구글 client-id / client-secret 은 여기 말고 backend/secret.yml 에 (git에 안 올라감)
    # ./ 는 "실행한 위치" 기준이라, backend 에서 실행(gradlew)해도 루트에서 실행(IntelliJ)해도 찾도록 두 곳을 본다
    import: "optional:file:./secret.yml,optional:file:./backend/secret.yml"
  datasource:
    # docker-compose.yml 의 MySQL. 운영에서는 환경변수로 덮어쓴다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/fashionfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:fashionfit}
    password: ${DB_PASSWORD:fashionfit}
  jpa:
    hibernate:
      # 테이블은 Flyway 가 만들고, Hibernate 는 "엔티티와 테이블이 맞는지" 검사만 한다. 안 맞으면 서버가 안 뜬다.
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # 스크린샷 업로드 크기 (기본값 1MB 는 휴대폰 스크린샷에 부족하다)
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:none}
        chat:
          options:
            # 모델 이름이 바뀌면 secret.yml 에 GEMINI_MODEL 로 덮어쓴다
            model: ${GEMINI_MODEL:gemini-flash-latest}
            # 낮을수록 같은 사진에 같은 답을 한다 (분석은 창의성보다 일관성이 중요)
            temperature: 0.2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:none}
            client-secret: ${GOOGLE_CLIENT_SECRET:none}
            # openid 를 빼면 OIDC 대신 일반 OAuth2 사용자 정보(userinfo)로 처리된다
            scope: profile, email
            # 구글이 로그인 후 돌려보낼 주소. 프론트(5173)를 거쳐 proxy 로 백엔드에 도착한다.
            # 구글 콘솔의 "승인된 리디렉션 URI"에 똑같이 등록해야 한다.
            redirect-uri: "${app.frontend-url}/login/oauth2/code/{registrationId}"

app:
  # 로그인 성공/실패 후 사용자를 보낼 프론트 주소
  frontend-url: http://localhost:5173

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
